<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <clipPath id="card"><rect x="3" y="3" width="114" height="114" rx="22"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d6f5"/><stop offset=".62" stop-color="#c6e4f8"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect x="3" y="3" width="114" height="114" fill="url(#sky)"/>
    <path d="M3 78h114v39H3z" fill="#f6ecdd"/>
    <!-- 雲 -->
    <g fill="#fdfaf2">
      <path d="M17 26a7 7 0 0 1 13-3 8 8 0 0 1 14 3z" /><rect x="17" y="24" width="27" height="4" rx="2"/>
      <path d="M85 24a8 8 0 0 1 14-3 8 8 0 0 1 13 3z"/><rect x="85" y="22" width="27" height="4" rx="2"/>
    </g>
    <!-- 地面影 -->
    <ellipse cx="60" cy="99" rx="46" ry="5" fill="#e2d3c6"/>
  </g>
  <rect x="3" y="3" width="114" height="114" rx="22" fill="none" stroke="#efe6d6" stroke-width="3"/>

  <g stroke="#2e1c40" stroke-width="2.6" stroke-linejoin="round">
    <!-- 車頂顆粒(後箱) -->
    <g fill="#efe7d6">
      <rect x="21" y="27" width="13" height="9" rx="4.5"/><rect x="37" y="27" width="13" height="9" rx="4.5"/>
      <rect x="53" y="27" width="13" height="9" rx="4.5"/><rect x="66" y="30" width="12" height="9" rx="4.5"/>
    </g>
    <!-- 後箱 -->
    <path d="M16 36h62l6 5v38H16z" fill="#f3ead7"/>
    <path d="M16 36h62l6 5H22z" fill="#e7dcc6"/>
    <!-- 車廂磚縫 -->
    <g stroke-width="1.5" fill="none" opacity=".8">
      <path d="M16 52h68M30 41v11M58 41v11M44 52v18M16 70h68"/>
    </g>

    <!-- 駕駛室顆粒 -->
    <g fill="#efe7d6">
      <rect x="79" y="40" width="12" height="9" rx="4.5"/><rect x="93" y="40" width="12" height="9" rx="4.5"/>
    </g>
    <!-- 駕駛室 -->
    <path d="M84 49h24l4 6v24H84z" fill="#f3ead7"/>
    <path d="M87 54h18l4 5v11H87z" fill="#8fc9ee"/>
    <path d="M96 54v16" stroke-width="2"/>
    <path d="M101 57l4 10" stroke="#d5edff" stroke-width="3" stroke-linecap="round"/>
    <!-- 引擎蓋(紫)+ 顆粒 -->
    <g fill="#6b2fa8"><rect x="94" y="64" width="10" height="8" rx="4"/><rect x="105" y="64" width="9" height="8" rx="4"/></g>
    <path d="M92 71h22v14H92z" fill="#5c2593"/>
    <!-- 格柵 -->
    <g fill="#3f3a48" stroke-width="0"><rect x="103" y="76" width="12" height="2.4" rx="1"/>
      <rect x="103" y="80" width="12" height="2.4" rx="1"/><rect x="103" y="84" width="12" height="2.4" rx="1"/></g>
    <!-- 腰線與底盤 -->
    <path d="M16 79h96v11H16z" fill="#5c2593"/>
    <path d="M14 89h100v6a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3z" fill="#4b4553"/>
    <!-- 橘色示廓燈 -->
    <rect x="12" y="76" width="7" height="9" rx="2" fill="#f5821f"/>
    <rect x="108" y="76" width="8" height="9" rx="2" fill="#f5821f"/>

    <!-- 輪拱 -->
    <path d="M25 90a13 13 0 0 1 26 0z" fill="#6b2fa8"/>
    <path d="M74 90a13 13 0 0 1 26 0z" fill="#6b2fa8"/>
  </g>

  <!-- 車身標誌:紫圓弧 + 橘三角 -->
  <path d="M45 47a11.5 11.5 0 1 0 11.5 12.6" fill="none" stroke="#5c2593" stroke-width="7" stroke-linecap="round"/>
  <path d="M53.5 43.5l11 6.4-11 6.4z" fill="#f5731f" stroke="#f5731f" stroke-width="3" stroke-linejoin="round"/>

  <!-- 輪子 -->
  <g stroke="#2e1c40" stroke-width="2.6">
    <circle cx="38" cy="92" r="14" fill="#3b3742"/>
    <circle cx="38" cy="92" r="6" fill="#b9b4c0"/>
    <circle cx="87" cy="92" r="14" fill="#3b3742"/>
    <circle cx="87" cy="92" r="6" fill="#b9b4c0"/>
  </g>
  <g fill="#2e1c40">
    <rect x="36" y="77" width="4" height="4" rx="1"/><rect x="36" y="103" width="4" height="4" rx="1"/>
    <rect x="23" y="90" width="4" height="4" rx="1"/><rect x="49" y="90" width="4" height="4" rx="1"/>
    <rect x="85" y="77" width="4" height="4" rx="1"/><rect x="85" y="103" width="4" height="4" rx="1"/>
    <rect x="72" y="90" width="4" height="4" rx="1"/><rect x="98" y="90" width="4" height="4" rx="1"/>
  </g>
</svg>
